<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Weaver</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app-theme.css">
<style>
body { margin: 0; background: var(--wv-paper); font-family: var(--wv-ui); color: var(--wv-ink); }
.adm-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--wv-hair); background: var(--wv-surface); }
.adm-brand { display: flex; align-items: center; gap: 10px; font-family: var(--wv-display); font-size: 20px; color: var(--wv-ink); text-decoration: none; }
.adm-brand img { width: 26px; height: 26px; }
.adm-top a.wv-linkbtn { font-size: 14px; color: var(--wv-ledger); text-decoration: none; }
.adm-main { max-width: 1120px; margin: 0 auto; padding: 28px; }
.adm-main h1 { font-family: var(--wv-display); font-weight: 400; font-size: 32px; letter-spacing: -0.01em; margin: 0; }
@media (max-width: 640px) { .adm-top, .adm-main { padding-left: 16px; padding-right: 16px; } }
/* ── Admin dashboard ────────────────────────────────────────────── */
.wv-admin-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.wv-admin-h { font-family: var(--wv-display); font-weight: 400; font-size: 22px; color: var(--wv-ink); margin: 28px 0 12px; }
.wv-kpis.wv-kpis-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.wv-admin-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; align-items: start; }
.wv-admin-grid .wv-panel { margin: 0; }
.wv-admin-grid h3, .wv-admin-panel-head h3 { font-size: 14px; font-weight: 600; color: var(--wv-ink); margin: 0 0 10px; }
.wv-admin-panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wv-admin-panel-head h3 { margin: 0; }
.wv-chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.wv-chart .wv-bar { fill: var(--wv-hair-strong); }
.wv-chart .wv-bar.is-current { fill: var(--wv-ledger); }
.wv-chart .wv-axis { stroke: var(--wv-hair-strong); stroke-width: 1; }
.wv-chart .wv-bar-val { font: 600 11px var(--wv-ui); fill: var(--wv-ink); text-anchor: middle; }
.wv-chart .wv-bar-label { font: 10.5px var(--wv-ui); fill: var(--wv-graphite); text-anchor: middle; }
.wv-table-plain { background: var(--wv-surface); border: 1px solid var(--wv-hair); border-radius: 10px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
.wv-table-plain tbody th { font-weight: 500; }
.wv-admin-note { font-size: 13px; margin: 10px 0 0; }
.wv-admin-spend { font-size: 15px; margin: 0 0 8px; color: var(--wv-graphite); }
.wv-admin-spend strong { font-size: 24px; color: var(--wv-ink); font-weight: 600; margin-right: 4px; }
.wv-meter { height: 8px; border-radius: 999px; background: var(--wv-sidebar); overflow: hidden; max-width: 420px; margin-bottom: 14px; }
.wv-meter span { display: block; height: 100%; background: var(--wv-ledger); }
.wv-note-warn { border-color: #E8C9A0; background: #FBF4EA; color: #6B4A1E; }
@media (max-width: 860px) { .wv-admin-grid { grid-template-columns: 1fr; } .wv-kpis.wv-kpis-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .wv-kpis.wv-kpis-4 .wv-kpi:nth-child(2) { border-right: 0; } .wv-kpis.wv-kpis-4 .wv-kpi:nth-child(-n+2) { border-bottom: 1px solid var(--wv-hair); } }
</style>
</head>
<body>
<header class="adm-top">
  <a class="adm-brand" href="/app/assistant"><img src="/weaver-badge.png" alt="">Weaver</a>
  <a class="wv-linkbtn" href="/app/assistant">Back to the app</a>
</header>
<main class="adm-main">
  <h1>Admin</h1>
  <p class="wv-page-sub">How many people use Weaver and how. Counts only, never anyone’s contacts or notes.</p>
  <div id="wv-admin-root" class="wv-page" style="margin-top:20px"></div>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
