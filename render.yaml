services:
  - type: web
    name: weaver
    env: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
           sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://weaver-kuwd.onrender.com/api/gmail/callback
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: weaver-db
    plan: free

